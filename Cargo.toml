[package]
name = "dnsshield"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
tokio = { version = "1.53", features = ["full"] }
tokio-quiche = "0.20.0"
tokio-rustls = "0.26"
rustls = "0.23"
hickory-proto = "0.26"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
